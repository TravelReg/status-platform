apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: status-platform
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-platform
  namespace: status-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: status-platform-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - status.travelregger.com
      secretName: status-platform-tls
  rules:
    - host: status.travelregger.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: status-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: status-frontend
                port:
                  number: 80
